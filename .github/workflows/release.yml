name: Release

# Runs whenever dev is merged into main (or anything else lands on main).
# Reads the version from Cargo.toml: if that version hasn't been released yet, it builds a
# Windows binary and publishes it as a DRAFT GitHub release so notes can be written and the
# release reviewed before it goes public. If the version was already released, it does nothing —
# bump the version in Cargo.toml to cut a new release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Read version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: tag_check
        shell: bash
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists - skipping. Bump the version in Cargo.toml to cut a new release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binary
        if: steps.tag_check.outputs.skip == 'false'
        run: cargo build --release

      - name: Package
        if: steps.tag_check.outputs.skip == 'false'
        shell: pwsh
        run: |
          $name = "baby-ssh-${{ steps.version.outputs.tag }}-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/baby-ssh.exe "dist/$name/"
          Copy-Item README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - name: Create draft release
        if: steps.tag_check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          files: dist/*.zip
